name: regression
on: [push, pull_request]
jobs:
  chat-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-chat.txt
      - run: python -m unittest tests.test_chat_store tests.test_chat_retrieval tests.test_chat_server tests.test_chat_backend tests.test_chat_reasonke tests.test_reasonke_runtime -v
      - run: python -m scripts.verify_reasonke_live --help
      - run: python -m scripts.verify_operations_http --help
      - run: python -m unittest tests.test_operations_http -v
      - run: python -m unittest tests.test_operations_evidence -v
      - run: python -m unittest tests.test_operations_explanations tests.test_operations_notebooks tests.test_operations_release -v
      - run: python -m unittest tests.test_operations_history -v
      - run: python -m unittest tests.test_operations_checkpoint -v
      - run: python -m unittest tests.test_india_demo tests.test_chat_iterative tests.test_depth_data tests.test_depth_retrieval tests.test_depth_runner tests.test_depth_notebook -v
      - run: python -m unittest tests.test_chat_workspace tests.test_operations_benchmark -v
      - run: python -m editguard_benchmark.run --help
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check editguard_chat/static/app.js
      - name: Build the chat website container without models
        run: docker build --file Dockerfile.chat --tag editguard-chat:ci .
      - name: Check the CLI without Ollama
        run: docker run --rm --network none editguard-chat:ci python -m editguard_chat.server --help
      - name: Verify optional iterative selector is packaged without a GPU
        run: docker run --rm --network none editguard-chat:ci python -c "from editguard_chat.reasonke_backend import IterativeFactContext; c=IterativeFactContext(); assert (c.fact_limit,c.seed_count,c.expansion_rounds)==(4,2,3); print('Bounded iterative selector available')"
      - name: Verify container HTTP, fact identity and workspace restoration without a model
        run: docker run --rm --network none editguard-chat:ci python -m editguard_chat.check_deployment
      - name: Serve the website without inventing a ready model
        run: |
          docker run --detach --name editguard-chat-ci --network host editguard-chat:ci
          python -c "import json,time,urllib.request; time.sleep(3); root=urllib.request.urlopen('http://127.0.0.1:8004/',timeout=10); assert root.status==200; state=json.load(urllib.request.urlopen('http://127.0.0.1:8004/api/status',timeout=10)); assert state['model']['ready'] is False; assert state['model']['error']; print('Website served; absent model reported honestly')"
      - run: docker logs editguard-chat-ci || true
        if: always()
      - run: docker stop editguard-chat-ci || true
        if: always()
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check editguard/static/app.js
      - run: node --check visionpatch/archive/v1/static/app.js
      - run: node --check visionpatch/static/workbench.js
      - run: node --check ke_repro/static/app.js
  optimizer-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDITGUARD_RUN_ML_TESTS: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt numpy==2.4.2 psutil==7.2.2 Pillow==12.3.0
      - run: pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests.test_trainer tests.test_answer_objective tests.test_scope_training_inputs -v
      - run: python -m unittest tests.test_visionpatch_editor tests.test_visionpatch_data tests.test_visionpatch_metrics tests.test_visionpatch_api tests.test_visionpatch_finalization -v
      - run: python -m unittest tests.test_visionpatch_registry tests.test_visionpatch_study_data tests.test_visionpatch_study tests.test_visionpatch_workbench tests.test_visionpatch_restore -v
      - run: python -m unittest tests.test_ke_repro_bridge tests.test_ke_repro_generation tests.test_ke_repro_finetune -v
  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Ephemeral loopback fixture; never use this token for an actual deployment.
      EDITGUARD_ADMIN_TOKEN: 'isolated-ci-fixture-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build --tag editguard:ci .
      - run: docker run --detach --name editguard-ci --publish 127.0.0.1:8001:8000 --volume editguard-ci-data:/app/runtime --env EDITGUARD_ADMIN_TOKEN editguard:ci
      - run: python scripts/verify_deployment.py --base-url http://127.0.0.1:8001 --admin-token-env EDITGUARD_ADMIN_TOKEN --output reports/deployment-smoke-ci.json
      - run: docker restart editguard-ci
      - run: python scripts/verify_persistence.py --base-url http://127.0.0.1:8001 --reference reports/deployment-smoke-ci.json --output reports/deployment-restart-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-deployment-smoke
          path: reports/deployment-*-ci.json
          if-no-files-found: ignore
      - run: docker logs editguard-ci || true
        if: always()
      - run: docker stop editguard-ci || true
        if: always()
  vision-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.visionpatch --tag visionpatch:ci .
      - run: docker run --detach --name visionpatch-ci --publish 127.0.0.1:8002:8002 visionpatch:ci
      - run: python -c "import time,urllib.request; time.sleep(5); paths=['/docs','/workbench','/static/workbench.js','/api/workbench/figures/selectivity.png','/api/workbench/figures/interference.png','/api/workbench/figures/paired_uncertainty.png']; responses=[urllib.request.urlopen('http://127.0.0.1:8002'+path,timeout=30) for path in paths]; assert all(response.status==200 for response in responses)"
      - run: docker exec visionpatch-ci python -c "from pathlib import Path; p=Path('/app/runtime/visionpatch/workbench/ci-write-check'); p.write_text('writable persistent mount target'); assert p.read_text()=='writable persistent mount target'"
      - run: docker logs visionpatch-ci || true
        if: always()
      - run: docker stop visionpatch-ci || true
        if: always()
  vlkeb-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned runtime on a CPU runner (no model assets)
        run: docker build --file Dockerfile.vlkeb --tag editguard-vlkeb:ci .
      - name: Check the workbench CLI without loading a model
        run: docker run --rm --network none editguard-vlkeb:ci python -m ke_repro.workbench --help
      - name: Import selected upstream modules without models or a GPU
        run: docker run --rm --network none editguard-vlkeb:ci python -c "from pathlib import Path; from ke_repro.bridge import _upstream_modules; _upstream_modules(Path('/app/tmp/vlkeb-upstream')); print('Selected upstream imports passed; no model constructed or checkpoint loaded')"
      - name: Verify the pinned checkout and writable default history target as the runtime user
        run: docker run --rm --network none editguard-vlkeb:ci python -c "from pathlib import Path; from ke_repro.smoke import verify_upstream; print(verify_upstream(Path('/app/tmp/vlkeb-upstream'))); p=Path('/app/artifacts/vlkeb/workbench'); p.mkdir(); f=p/'ci-write-check'; f.write_text('history writable'); assert f.read_text()=='history writable'"
